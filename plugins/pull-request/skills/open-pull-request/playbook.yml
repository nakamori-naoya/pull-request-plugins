# open-pull-request — 検証済みbranchからPull Requestを作成する平時の流れ。競合は例外で、検出したときだけ resolve-pr-conflicts を呼ぶ。
# 工程順はこのYAMLの宣言を正式な定義とするで、agent_work工程はこのSKILLを実行する同じagentが同じ文脈で担う。
# repositoryごとの方針（verification.commands）は <repo>/.harness-plugins/open-pull-request.config.yml が持つ。
# 公開Git操作の方針・permission・human gateは agent-work-policy の公開契約が所有する。
version: 2
name: open-pull-request
description: 検証済みbranchからPull Requestを作成し、レビュー受付へ遷移する。競合を検出したときだけ競合解消の入口を呼ぶ
inputs: [repository_path, user_input, document_destination, references]
requires:
  - {plugin: agent-work-policy, marketplace: agent-work-policy}

# stepsは記載順に実行する。script: 自分の入口内の決定論的な処理。skill: 同packageの公開入口。playbook: 外部packageの公開playbook。
# 外部playbookの完全な入力objectは同じagentがneedsと利用者入力から実行時に組み立てる。
# YAMLへ部分objectや動的placeholderを置かない。when: 実行時成果が真のときだけ実行する。
steps:
  - id: read-policy
    script: scripts/config.py
    purpose: repository rootの設定file（verification.commands）を read で読み、schemaを検査する。無ければ止まる
    needs: [repository_path]
    provides: [verification]
  - id: workspace
    playbook: agent-work-policy
    purpose: 何も変えずに、いまの作業場所と状態（作業branch、clean、baseの有無、開いているPR）を受け取る
    needs: [repository_path]
    provides: [workspace, workspace_state, gate_state]
  - id: detect-conflicts
    script: scripts/conflicts.py
    purpose: 未解消のindexと git merge-tree の非破壊mergeで、base branchとの競合の有無と競合fileだけを検出する。調査・解消はしない
    needs: [workspace, workspace_state]
    provides: [conflict_state]
  - id: resolve-conflicts
    skill: resolve-pr-conflicts
    when: conflict_state.has_conflicts
    purpose: 競合を検出したときだけ、同packageの競合解消の入口へ入力をそのまま渡し、調査・資料化・gate・解消・検証を完了させる
    needs: [repository_path, user_input, document_destination, references, conflict_state]
    provides: [conflict_resolution]
  - id: verify
    script: scripts/verify.py
    purpose: 設定fileの verification.commands を記載順に作業branchで実行し、1件でも失敗したら残りを実行せず止まる
    needs: [verification, workspace_state]
    conditional_needs:
      - when: conflict_state.has_conflicts
        needs: [conflict_resolution]
    provides: [verification_result]
  - id: prepare-pull-request
    agent_work: invoking_agent
    purpose: 検証済みbranchから、重複のないPull Requestのtitleとbodyを組み立てる
    needs: [workspace, workspace_state, conflict_state, verification_result]
    conditional_needs:
      - when: conflict_state.has_conflicts
        needs: [conflict_resolution]
    provides: [pr_title, pr_body_file]
  - id: push
    playbook: agent-work-policy
    purpose: permissionとhuman gateに従って検証済みbranchをpushする
    needs: [pr_title, pr_body_file]
    provides: [pushed_branch, gate_state]
  - id: create-pull-request
    playbook: agent-work-policy
    purpose: permissionとhuman gateに従ってPull Requestを作る
    needs: [pushed_branch, pr_title, pr_body_file]
    provides: [pull_request, gate_state]
  - id: approve-ready-for-review
    script: scripts/gate.py
    purpose: 内部レビュー完了の明示があるまでレビュー受付への遷移を止める
    needs: [pull_request]
    provides: [internal_review_complete]
  - id: ready-for-review
    playbook: agent-work-policy
    purpose: 内部レビュー完了を確認した下書きPull Requestをレビュー受付へ遷移する
    needs: [pull_request, internal_review_complete]
    provides: [review_accepting, gate_state]
