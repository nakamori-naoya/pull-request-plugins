# version/name/description: 設定形式、plugin名、段取りの目的。
# instructions: 実行時の絶対規則。requires: 必須の下段plugin。
version: 2
name: pr-review-response
description: PR reviewを評価し、採用分だけを修正・検証・commit・pushする
inputs: [repository_path, pull_request, user_input, document_destination]
instructions:
  execution:
    directive: permissionsとhuman gateを厳守し、stepsを上から順に実行する
requires:
  - {plugin: pr-review-assess, marketplace: pull-request}
  - {plugin: pr-review-apply, marketplace: pull-request}
  - {plugin: pr-review-verify, marketplace: pull-request}
  - {plugin: write-doc, marketplace: write-doc}
  - {plugin: agent-work-policy, marketplace: agent-work-policy}

# 下段どうしをつなぐ契約。**上段が持つ。**
# 評価工程が出し、適用工程が受ける JSON の形で、両者はこの一覧の写しを実装に持つ。
# 写しがずれると「前工程が通したものを次工程が落とす」事故になるので、lint が一致を検査する。
contract:
  # assessment_root/comment: 評価JSONに必須のfield。decision: 許される採否値。
  assessment_root: [schema, repository, pull_request, head_sha, comments]
  assessment_comment: [id, decision, intent, reason, proposed_change, verification]
  decision: [accept, reject, defer]
# report: 評価過程を資料化するか。timingは資料を挟む位置。
report:
  enabled: false
  timing: before_commit
# permissions: review取込と修正だけをこのplaybookが判断する。公開Git操作の許可は
# 委譲先のplaybookが判断する。
permissions:
  review_import: true
  modify: true
# gates: review判断と修正だけをこのplaybookが扱う。commit/pushのgateは
# 委譲先のplaybookが判定し、その公開出力で承認待ちを知る。
gates:
  after_assessment: true
  before_modify: true
  after_modify: true
# verification.commands: 修正後にすべて成功させるcommand。
verification:
  commands: ["git diff --check"]
# git: review取込の開始時clean必須か、作成するcommit message。
git:
  require_clean_start: true
  commit_message: Address accepted PR review feedback
# stepsは記載順に実行する。
# skill/script: 自分のpackage内の処理。playbook: 外部pluginの公開playbook。
# input: その1回の呼び出しへ渡す公開入力。needs: 開始条件。provides: 完了時の成果物。
# when: 条件が真のときだけ実行。conditional_needs: 同じ条件のときだけ増える開始条件。
steps:
  - id: preflight
    script: scripts/review-gate.py
    purpose: repositoryと開始時worktree状態を検査する
    needs: [repository_path, pull_request]
    provides: [baseline]
  - id: review-import-permission
    script: scripts/review-gate.py
    purpose: review commentを取得してよいpermissionを確認し、禁止なら取得前に止める
    needs: [baseline]
    provides: [review_import_allowed]
  - id: assess
    agent_work: invoking_agent
    purpose: MCPでreview commentを取得し、sourceと照合して採否を判断する
    needs: [baseline, review_import_allowed]
    provides: [assessment]
  - id: assessment-gate
    script: scripts/review-gate.py
    purpose: 評価結果を人間へ提示し、設定されたgateを通す
    when: assessment.accepted_count > 0
    needs: [assessment]
    provides: [assessment_approved]
  - id: report-after-assessment
    playbook: write-doc
    when: assessment.accepted_count > 0 && report.enabled && report.timing == after_assessment
    purpose: 同じagentが評価・採否判断をkind:textのmaterialにし、公開保存先へ資料化する
    needs: [assessment, assessment_approved, document_destination]
    provides: [status, path, reason]
  - id: modify-gate
    script: scripts/review-gate.py
    purpose: 修正許可と修正前gateを確認する
    needs: [assessment_approved]
    conditional_needs:
      - when: assessment.accepted_count > 0 && report.enabled && report.timing == after_assessment
        needs: [path]
    provides: [modify_approved]
  - id: modify
    agent_work: invoking_agent
    purpose: 採用分だけを実装する
    needs: [assessment, modify_approved]
    provides: [changes, change_report]
  - id: modified-gate
    script: scripts/review-gate.py
    purpose: 修正差分を人間へ提示し、修正後gateを通す
    needs: [changes, change_report]
    provides: [changes_approved]
  - id: verify
    agent_work: invoking_agent
    purpose: 設定された検証を実行する
    needs: [changes_approved]
    provides: [verification]
  - id: report-before-commit
    playbook: write-doc
    when: report.enabled && report.timing == before_commit
    purpose: 同じagentが評価、変更差分、検証結果をkind:textのmaterialにし、公開保存先へcommit前資料として保存する
    needs: [assessment, change_report, verification, document_destination]
    provides: [status, path, reason]
  - id: commit
    playbook: agent-work-policy
    purpose: 限定したpathとmessageを公開入力として渡し、permissionとhuman gateに従ってcommitする
    needs: [verification]
    conditional_needs:
      - when: report.enabled && report.timing == before_commit
        needs: [path]
    provides: [commit, gate_state, workspace]
  - id: report-before-push
    playbook: write-doc
    when: report.enabled && report.timing == before_push
    purpose: 同じagentが評価、変更差分、検証結果、commitをkind:textのmaterialにし、公開保存先へpush前資料として保存する
    needs: [assessment, change_report, verification, commit, document_destination]
    provides: [status, path, reason]
  - id: push
    playbook: agent-work-policy
    purpose: permissionとhuman gateに従って作業branchをpushする
    needs: [commit]
    conditional_needs:
      - when: report.enabled && report.timing == before_push
        needs: [path]
    provides: [pushed_branch, gate_state]
  - id: report-after-push
    playbook: write-doc
    when: report.enabled && report.timing == after_push
    purpose: 同じagentが評価からpush結果までをkind:textのmaterialにし、公開保存先へ資料化する
    needs: [assessment, change_report, verification, commit, pushed_branch, document_destination]
    provides: [status, path, reason]
