# version/name/description: 設定形式、plugin名、段取りの目的。
# instructions: 実行時の絶対規則。requires: 必須の下段plugin。
version: 2
name: pull-request
description: 競合を調査・解消し、検証済みbranchからPull Requestを作成する
instructions:
  execution:
    directive: repositoryのpermissionとhuman gateを守り、現在の実装と関連履歴を確認してstepsを上から順に実行する
requires:
  - {plugin: pr-conflict-inspect, marketplace: pull-request}
  - {plugin: pr-conflict-resolve, marketplace: pull-request}
  - {plugin: pr-create, marketplace: pull-request}
  - {plugin: write-doc, marketplace: write-doc}
  - {plugin: agent-work-policy, marketplace: agent-work-policy}

# conflict_report.timing: 競合資料を解消前の提案、解消後の実績のどちらで作るか。
conflict_report:
  timing: before_resolution
# verification.commands: 競合解消後、PR作成前にすべて成功させるcommand。
verification:
  commands: ["git diff --check"]

# stepsは記載順に実行する。
# skill/script: 自分のpackage内の処理。playbook: 外部pluginの公開playbook。
# input: その1回の呼び出しへ渡す公開入力。when: 実行時成果または設定が真のときだけ実行する。
steps:
  - id: workspace
    playbook: agent-work-policy
    input: {action: inspect}
    purpose: 何も変えずに、いまの作業場所と状態（作業branch、clean、baseの有無、開いているPR）を受け取る
    provides: [workspace, workspace_state, gate_state]
  - id: inspect-conflicts
    skill: inspect-pr-conflicts
    purpose: 現行実装、関連commit、過去PRから競合と両側の意図を調べる
    needs: [workspace, workspace_state]
    provides: [conflict_state, conflict_assessment]
  - id: report-before-resolution
    playbook: write-doc
    when: conflict_state.has_conflicts && conflict_report.timing == before_resolution
    purpose: 競合内容と推奨解消方針を提案資料にして解消前に利用者へ示す
    needs: [conflict_state, conflict_assessment]
    provides: [conflict_proposal]
  - id: approve-conflict-proposal
    script: scripts/gate.sh
    when: conflict_state.has_conflicts && conflict_report.timing == before_resolution
    purpose: 提案資料を示した後、利用者の明示承認まで競合解消を止める
    needs: [conflict_proposal]
    provides: [conflict_proposal_approved]
  - id: resolve-conflicts
    skill: resolve-pr-conflicts
    when: conflict_state.has_conflicts
    purpose: 調査した意図と現在状態を照合し、競合を解消して検証する
    needs: [conflict_state, conflict_assessment]
    conditional_needs:
      - when: conflict_report.timing == before_resolution
        needs: [conflict_proposal_approved]
    provides: [conflict_resolution, conflict_verification]
  - id: report-after-resolution
    playbook: write-doc
    when: conflict_state.has_conflicts && conflict_report.timing == after_resolution
    purpose: 起きていた競合、採った方針、修正、検証を解消後の資料にする
    needs: [conflict_state, conflict_assessment, conflict_resolution, conflict_verification]
    provides: [conflict_resolution_report]
  - id: prepare-pull-request
    skill: create-pull-request
    purpose: 競合が無い検証済みbranchから、重複のないPull Requestのtitleとbodyを組み立てる
    needs: [workspace, workspace_state, conflict_state]
    conditional_needs:
      - when: conflict_state.has_conflicts
        needs: [conflict_resolution, conflict_verification]
      - when: conflict_state.has_conflicts && conflict_report.timing == before_resolution
        needs: [conflict_proposal_approved]
      - when: conflict_state.has_conflicts && conflict_report.timing == after_resolution
        needs: [conflict_resolution_report]
    provides: [pr_title, pr_body_file]
  - id: push
    playbook: agent-work-policy
    input: {action: push}
    purpose: permissionとhuman gateに従って検証済みbranchをpushする
    needs: [pr_title, pr_body_file]
    provides: [pushed_branch, gate_state]
  - id: create-pull-request
    playbook: agent-work-policy
    input: {action: pull-request}
    purpose: permissionとhuman gateに従ってPull Requestを作る
    needs: [pushed_branch, pr_title, pr_body_file]
    provides: [pull_request, gate_state]
  - id: approve-ready-for-review
    script: scripts/gate.sh
    purpose: 内部レビュー完了の明示があるまでレビュー受付への遷移を止める
    needs: [pull_request]
    provides: [internal_review_complete]
  - id: ready-for-review
    playbook: agent-work-policy
    input: {action: ready-for-review}
    purpose: 内部レビュー完了を確認した下書きPull Requestをレビュー受付へ遷移する
    needs: [pull_request, internal_review_complete]
    provides: [review_accepting, gate_state]
